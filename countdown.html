<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Ready, Yahya! ⏳</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Shared Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <style>
    #countdown-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Fireworks Canvas -->
  <canvas id="countdown-canvas"></canvas>

  <!-- Progress Bar (2 of 7) -->
  <header class="progress-header">
    <span class="progress-step-text">Surprise 2 of 7 • Get Ready</span>
    <div class="progress-dots">
      <span class="progress-dot completed"></span>
      <span class="progress-dot active"></span>
      <span class="progress-dot"></span>
      <span class="progress-dot"></span>
      <span class="progress-dot"></span>
      <span class="progress-dot"></span>
      <span class="progress-dot"></span>
    </div>
  </header>

  <!-- Page Content -->
  <main class="page-wrapper">
    <div class="content-container">
      <div class="glass-card">
        <span class="tag-badge">⏳ The Countdown Begins</span>
        <h1 class="title-display">Something special is coming...</h1>
        <p class="subtitle">Take a deep breath. A legendary celebration is about to begin!</p>

        <!-- Big Countdown Number -->
        <div class="countdown-box">
          <div class="countdown-number" id="countdown-num">5</div>
          <div class="countdown-message" id="countdown-msg">Are you ready, Yahya? 🚀</div>
        </div>

        <div>
          <a href="wish.html" class="btn-secondary" style="font-size: 0.88rem; padding: 8px 20px;">
            Skip Countdown ➜
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Shared Controller Script -->
  <script src="script.js"></script>
</body>
</html>
