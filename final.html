<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Last Surprise, Yahya ❤️</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Shared Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Fireworks Canvas -->
  <canvas id="finale-canvas"></canvas>

  <!-- Progress Bar (7 of 7) -->
  <header class="progress-header">
    <span class="progress-step-text">Surprise 7 of 7 • Grand Finale</span>
    <div class="progress-dots">
      <span class="progress-dot completed"></span>
      <span class="progress-dot completed"></span>
      <span class="progress-dot completed"></span>
      <span class="progress-dot completed"></span>
      <span class="progress-dot completed"></span>
      <span class="progress-dot completed"></span>
      <span class="progress-dot active"></span>
    </div>
  </header>

  <!-- Page Content -->
  <main class="page-wrapper">
    <div class="content-container">
      <div class="glass-card finale-card">
        <span class="tag-badge">🎆 The Grand Finale</span>
        <h1 class="title-display">Happy Birthday <span class="friend-name">Yahya</span> ❤️</h1>
        
        <p style="font-size: clamp(1.2rem, 3vw, 1.6rem); color: #ffffff; font-weight: 400; line-height: 1.5; margin-bottom: 12px;">
          Stay blessed, my brother.
        </p>

        <p class="subtitle" style="margin-bottom: 24px;">
          Here’s to another year of unstoppable energy, unbreakable friendship, and making memories that live forever.
        </p>

        <span class="finale-brotherhood-badge">
          – From your sister, <span class="my-name">Shree</span> ❤️
        </span>

        <!-- Action Controls -->
        <div class="finale-buttons">
          <button id="btn-replay-journey" class="btn-primary" type="button">
            Replay 🔁
          </button>
          <a href="memories.html" class="btn-secondary">
            Back to Memories 📸
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Shared Controller Script -->
  <script src="script.js"></script>
</body>
</html>
